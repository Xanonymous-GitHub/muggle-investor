# Builds the `muggle-investor` Secret from Bitwarden, through the cluster's store. Create one
# Bitwarden item per `remoteRef.key` below; the item's value is the secret.
#   AUTH_SECRET, CRON_SECRET:  openssl rand -hex 32  (two different values, 32+ characters)
#   INVITE_CODES:              comma-separated codes of 16+ random characters
#   db password:               openssl rand -hex 32  (hex only: it goes into a URL unescaped)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: muggle-investor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-xcc-infra-k8s-admin
  target:
    name: muggle-investor
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # sslmode=require: CNPG serves TLS; the traffic stays encrypted on the pod network.
        DATABASE_URL: "postgres://muggle_investor:{{ .dbPassword }}@cnpg-rw.database.svc:5432/muggle_investor?sslmode=require"
        AUTH_SECRET: "{{ .authSecret }}"
        CRON_SECRET: "{{ .cronSecret }}"
        INVITE_CODES: "{{ .inviteCodes }}"
        DARKFANXING_KEY: "{{ .darkfanxingKey }}"
        LLM_API_KEY: "{{ .llmApiKey }}"
        # Optional upstream token: add a remoteRef for it and a line here.
        # FINMIND_TOKEN: "{{ .finmindToken }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: muggle-investor-db-password
    - secretKey: authSecret
      remoteRef:
        key: muggle-investor-auth-secret
    - secretKey: cronSecret
      remoteRef:
        key: muggle-investor-cron-secret
    - secretKey: inviteCodes
      remoteRef:
        key: muggle-investor-invite-codes
    - secretKey: darkfanxingKey
      remoteRef:
        key: muggle-investor-darkfanxing-key
    - secretKey: llmApiKey
      remoteRef:
        key: muggle-investor-llm-api-key
