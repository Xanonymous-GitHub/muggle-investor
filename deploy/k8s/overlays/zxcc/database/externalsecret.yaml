# The login CNPG creates for the role. A DatabaseRole needs a kubernetes.io/basic-auth Secret
# (username + password). The password is the same Bitwarden item the app's DATABASE_URL uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-muggle-investor-secret
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-xcc-infra-k8s-admin
  target:
    name: cnpg-muggle-investor-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Tells CNPG to re-apply the role when the password changes.
          cnpg.io/reload: "true"
      data:
        username: muggle_investor
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: muggle-investor-db-password
