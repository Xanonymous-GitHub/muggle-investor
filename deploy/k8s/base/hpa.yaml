# Always at least 2 pods (HA), up to 4 under load. The same shape as traefik and n8n in this cluster.
# Scaling needs metrics-server and the CPU request on the Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: muggle-investor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: muggle-investor
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
